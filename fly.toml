# fly.toml app configuration file generated for student-backend-chamara on 2026-08-29T08:32:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'student-backend-chamara'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false 
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

  
[[services.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "get"
  path = "/"
  timeout = "10s"


  
